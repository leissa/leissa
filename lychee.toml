# Configuration for the weekly link check (.github/workflows/links.yml).

# Badge images are generated by shields.io and always resolve; the interesting
# link is the href behind them.  The other hosts serve bots a login wall or a
# bot challenge, which is not the same thing as a dead link.
exclude = [
    '^https://img\.shields\.io',
    '^https://www\.linkedin\.com',
    '^https://scholar\.google\.',
    '^https://dblp\.uni-trier\.de',
]

# Publisher sites (ACM, IEEE, Elsevier, ...) often answer scripted requests with
# 403 or rate-limit them; that still means the DOI resolved.
accept = [200, 206, 403, 429]

max_retries = 3
max_concurrency = 8
timeout = 30
