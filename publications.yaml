# Publication database -- the single source of truth for the `## Publications`
# section of README.md and for leissa.bib.
#
# After editing, regenerate with:   tools/gen.py
# (and `tools/gen.py --bib` to also refresh leissa.bib from doi.org).
#
# Fields
#   id          pdf/<id>.pdf; author initials + two-digit year, in author order
#   title       exactly as published
#   authors     full author list, in publication order
#   year        publication year (groups the entry into a `###` section)
#   selected    show in the "Selected" list at the top of the section
#   cite        the paper GitHub offers under "Cite this repository" (exactly one)
#   venue       venue badge label (omit for preprint-only entries)
#   venue_year  right-hand side of the venue badge (defaults to `year`)
#   venue_url   the venue *of that year*: conference site or proceedings TOC
#   doi         publisher DOI; the publisher badge is derived from its prefix
#   arxiv       arXiv DOI (10.48550/...)
#   zenodo      artifact DOI (10.5281/...)
#   awards      [{name, text, url}] -- `name` may carry a leading emoji
#   repos       [{label, url}] -- code/artifact links
#   youtube     talk recording
#   dblp        dblp record key, i.e. the part after `/rec/` in the record URL
#   bibtype     BibTeX entry type, when doi.org guesses wrong (e.g. phdthesis)
#
# Badge *rendering* (shields escaping, publisher logos, badge order) lives in
# tools/gen.py -- never hand-edit badges in README.md, they get overwritten.

